<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=PT+Serif:ital,wght@0,400;0,700;1,400;1,700&family=Playfair:ital,opsz,wght@0,5..1200,300..900;1,5..1200,300..900&display=swap" rel="stylesheet">
    <title>Where is Miso? - Visual Novel</title>
    <style>
        :root {
            --genshin-bg: #fdf6e3;
            --genshin-border: #d4c5b0;
            --genshin-text: #5a4a42;
            --genshin-btn-hover: #e8dcc8;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif, 'Playfair', 'PT Serif';
            overflow: hidden;
            color: var(--genshin-text);
        }

        /* Full Screen Container */
        #game-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
            background: #000;
        }

        /* Top visual window takes up upper portion of full screen */
        #visual-layer {
            width: 100%;
            height: 67.67%;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            transition: background-image 0.5s ease-in-out;
            position: relative;
        }

        /* Full-width dialogue panel at the bottom */
        #ui-layer {
            width: 100%;
            height: 33.33%;
            background-image: url('https://i.ibb.co/hGdcpfP/text-box.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            border-top: 6px solid var(--genshin-border);
            padding: 30px 10%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            bottom: 0;
            font-family: 'Playfair';
        }

        /* Character Name Tag */
        #speaker-name {
            position: absolute;
            top: -20px;
            left: 10%;
            background: #4a5c6a;
            color: #fff;
            padding: 6px 24px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 16px;
            border: 2px solid var(--genshin-border);
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            display: none;
        }

        #story-text {
            font-size: 18px;
            line-height: 1.6;
            flex-grow: 1;
            margin-bottom: 15px;
            overflow-y: auto;
        }

        /* Stacked vertically (one under another) */
        #choices-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            opacity: 0; /* Hidden initially, shown after typing */
            transition: opacity 0.3s ease;
            width: 100%;
            bottom: 10px;
        }

        .btn {
            background: #fff;
            border: 2px solid var(--genshin-border);
            color: var(--genshin-text);
            padding: 8px 16px;
            font-family: 'PT Serif';
            font-size: 16px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            display: block;
            text-align: center;
            width: 100%;
            max-width: 500px; /* Clean stacked width */
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .btn:hover {
            background: var(--genshin-btn-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.1);
        }

        .btn:active {
            transform: translateY(1px);
        }

        /* Ending screen overlay */
        #fade-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: black;
            opacity: 0;
            pointer-events: none;
            transition: opacity 2s ease;
            z-index: 10;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="fade-overlay"></div>
    <div id="visual-layer"></div>
    
    <div id="ui-layer">
        <div id="speaker-name">You</div>
        <div id="story-text"></div>
        <div id="choices-container">
            <!-- Buttons dynamically inserted here -->
        </div>
    </div>
</div>

<script>
    /* 
       EACH FRAME HAS ITS OWN UNIQUE IMAGE PROPERTY!
       Replace the placeholder path strings (e.g., 'paths/part1.jpg') with your image paths.
    */
    const storyNodes = {
        start: {
            text: "A frightened orange-and-white cat suddenly bumps into you before sprinting away. It keeps glancing behind as if something is chasing it.",
            image: 'https://i.ibb.co/Gv6J5zZ7/part1.png',
            choices: [
                { text: "Follow the cat.", next: "part2" },
                { text: "Call out to it gently.", next: "part2" }
            ]
        },
        part2: {
            text: "The cat leads you through narrow streets until it disappears behind an old warehouse. From the corner, you notice a white van parked nearby.",
            image: 'https://i.ibb.co/XfkQryWf/part2.png',
            choices: [
                { text: "Peek around the warehouse.", next: "part3" },
                { text: "Stay hidden and observe.", next: "part3" }
            ]
        },
        part3: {
            text: "A man, carefully places several frightened cats into secure carriers inside the van. None of the cats appear injured, but they're clearly scared.",
            image: 'https://i.ibb.co/JwYtpcKY/part3.png',
            choices: [
                { text: "Watch from a distance.", next: "part4" },
                { text: "Move a little closer.", next: "part4" }
            ]
        },
        part4: {
            text: "The same cat notices you again and quietly slips beneath the van. It looks back at you, almost inviting you to follow.",
            image: 'paths/part4.jpg',
            choices: [
                { text: "Crawl closer.", next: "part5" },
                { text: "Wait until the man looks away.", next: "part5" }
            ]
        },
        part5: {
            text: "The man finishes loading the carriers and briefly walks into the warehouse. The van door remains slightly open.",
            image: 'paths/part5.jpg',
            choices: [
                { text: "Sneak toward the van.", next: "part6" },
                { text: "Listen for any sounds inside.", next: "part6" }
            ]
        },
        part6: {
            text: "Soft meows echo from inside. You can't tell where the scared cat went, but the voices of many cats come from the van.",
            image: 'paths/part6.jpg',
            choices: [
                { text: "Climb inside.", next: "part7" },
                { text: "Look around once more.", next: "part7" }
            ]
        },
        part7: {
            text: "You quietly climb into the back of the van and hide behind a stack of empty blankets and boxes.",
            image: 'paths/part7.jpg',
            choices: [
                { text: "Stay perfectly still.", next: "part8" },
                { text: "Peek through a small gap.", next: "part8" }
            ]
        },
        part8: {
            text: "The van engine starts. Through the gap, you see the warehouse slowly disappear behind you as the cats quietly meow.",
            image: 'paths/part8.jpg',
            choices: [
                { text: "Keep hiding.", next: "part9" },
                { text: "Try to calm the nearest cat.", next: "part9" }
            ]
        },
        part9: {
            text: "The ride feels endless. The gentle vibration of the van and the warm blankets begin making your eyelids heavy.",
            image: 'paths/part9.jpg',
            choices: [
                { text: "Fight the sleep.", next: "part10" },
                { text: "Rest your eyes for a moment.", next: "part10" }
            ]
        },
        part10: {
            text: "Your thoughts become blurry. The sounds of the road fade, replaced only by the soft purring of a nearby cat.",
            image: 'paths/part10.jpg',
            choices: [
                { text: "Stay awake.", next: "part11" },
                { text: "Close your eyes.", next: "part11" }
            ]
        },
        part11: {
            text: "You drift into a deep sleep, unaware of how much time has passed.",
            image: 'paths/part11.jpg',
            choices: [
                { text: "...", next: "part12" },
                { text: "...", next: "part12" }
            ]
        },
        part12: {
            text: "Everything is silent. No engine. No voices. Only darkness surrounds you.",
            image: 'paths/part12.jpg',
            choices: [
                { text: "...", next: "part13" },
                { text: "...", next: "part13" }
            ]
        },
        part13: {
            text: "You slowly open your eyes. It's pitch black. The air is cold, and you have no idea where you are.",
            image: 'paths/part13.jpg',
            choices: [
                // Final anchor tag redirection
                { text: "Stand up.", isLink: true, url: "room.html" },
                { text: "Look for a light.", isLink: true, url: "index.html" }
            ]
        }
    };

    let typingTimer;
    const textSpeed = 25; // ms per character
    const storyTextElement = document.getElementById('story-text');
    const choicesContainer = document.getElementById('choices-container');
    const visualLayer = document.getElementById('visual-layer');
    const speakerName = document.getElementById('speaker-name');
    const fadeOverlay = document.getElementById('fade-overlay');

    function renderNode(nodeId) {
        const node = storyNodes[nodeId];
        
        // Hide choices initially
        choicesContainer.style.opacity = 0;
        choicesContainer.innerHTML = '';
        
        // Set Frame-Specific Background Image
        visualLayer.style.backgroundImage = `url('${node.image}')`;

        // Speaker tag display
        if (nodeId === 'start') {
            speakerName.style.display = 'block';
        }

        // Dark overlay effect for the dark/sleeping transition frames
        if (nodeId === 'part12' || nodeId === 'part13') {
            fadeOverlay.style.opacity = 1;
            setTimeout(() => {
                fadeOverlay.style.background = "rgba(0,0,0,0.85)";
                typeText(node);
            }, 1000);
        } else {
            typeText(node);
        }
    }

    function typeText(node) {
        clearTimeout(typingTimer);
        storyTextElement.innerHTML = '';
        let i = 0;
        
        let textToType = node.text.replace(/<br>/g, '|');

        function type() {
            if (i < textToType.length) {
                if (textToType.charAt(i) === '|') {
                    storyTextElement.innerHTML += '<br>';
                } else {
                    storyTextElement.innerHTML += textToType.charAt(i);
                }
                i++;
                typingTimer = setTimeout(type, textSpeed);
            } else {
                showChoices(node.choices);
            }
        }
        type();
    }

    function showChoices(choices) {
        choicesContainer.innerHTML = '';
        
        choices.forEach(choice => {
            if (choice.isLink) {
                // Redirect via anchor tag on the final room scene
                const link = document.createElement('a');
                link.href = choice.url;
                link.className = 'btn';
                link.innerText = choice.text;
                choicesContainer.appendChild(link);
            } else {
                // Regular decision button
                const btn = document.createElement('button');
                btn.className = 'btn';
                btn.innerText = choice.text;
                btn.onclick = () => renderNode(choice.next);
                choicesContainer.appendChild(btn);
            }
        });

        setTimeout(() => {
            choicesContainer.style.opacity = 1;
        }, 100);
    }

    window.onload = () => {
        renderNode('start');
    };
</script>


</body>
</html>
