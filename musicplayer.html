<body>
    <canvas id="stars"></canvas>

<script>
const canvas = document.getElementById("stars");
const ctx = canvas.getContext("2d");

let stars = [];

let mouseX = -1000;
let mouseY = -1000;

const STAR_COUNT = 1024;
const POINTER_RADIUS = 180;

function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);

    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;

    canvas.style.width = window.innerWidth + "px";
    canvas.style.height = window.innerHeight + "px";

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function createStar(initial = false) {
    return {
        x: Math.random() * window.innerWidth,
        y: Math.random() * window.innerHeight,

        size: Math.random() * 0.8 + 0.3,

        life: initial
            ? Math.random() * 500
            : 0,

        maxLife: Math.random() * 500 + 350,

        fadeIn: Math.random() * 100 + 70,
        fadeOut: Math.random() * 120 + 80,

        delay: initial
            ? 0
            : Math.random() * 100,

        rotation: Math.random() * Math.PI,

        brightness: Math.random() * 0.32 + 0.18,

        twinkleSpeed:
            Math.random() * 0.006 + 0.002,

        twinkleOffset:
            Math.random() * Math.PI * 2
    };
}

function resetStar(star) {
    Object.assign(star, createStar());
}

for (let i = 0; i < STAR_COUNT; i++) {
    stars.push(createStar(true));
}

window.addEventListener("resize", resize);

window.addEventListener("pointermove", e => {
    mouseX = e.clientX;
    mouseY = e.clientY;
});

window.addEventListener("pointerleave", () => {
    mouseX = -1000;
    mouseY = -1000;
});

function drawStar(
    x,
    y,
    size,
    alpha,
    rotation,
    glow
) {
    ctx.save();

    ctx.translate(x, y);
    ctx.rotate(rotation);

    ctx.globalAlpha = alpha;

    ctx.shadowBlur = glow;
    ctx.shadowColor =
        "rgba(255,255,255,0.8)";

    ctx.fillStyle = "#ffffff";

    ctx.beginPath();

    ctx.moveTo(0, -size * 2.2);

    ctx.quadraticCurveTo(
        size * 0.12,
        -size * 0.12,
        size * 2.2,
        0
    );

    ctx.quadraticCurveTo(
        size * 0.12,
        size * 0.12,
        0,
        size * 2.2
    );

    ctx.quadraticCurveTo(
        -size * 0.12,
        size * 0.12,
        -size * 2.2,
        0
    );

    ctx.quadraticCurveTo(
        -size * 0.12,
        -size * 0.12,
        0,
        -size * 2.2
    );

    ctx.fill();

    ctx.restore();
}

function animate(time) {

    ctx.clearRect(
        0,
        0,
        window.innerWidth,
        window.innerHeight
    );

    for (const star of stars) {

        if (star.delay > 0) {
            star.delay--;
            continue;
        }

        star.life++;

        if (star.life >= star.maxLife) {
            resetStar(star);
            continue;
        }

        let lifeAlpha = 1;

        if (star.life < star.fadeIn) {
            lifeAlpha =
                star.life / star.fadeIn;
        }

        const remaining =
            star.maxLife - star.life;

        if (remaining < star.fadeOut) {
            lifeAlpha =
                remaining / star.fadeOut;
        }

        const slowTwinkle =
            0.65 +
            Math.sin(
                time * star.twinkleSpeed +
                star.twinkleOffset
            ) * 0.35;

        let alpha =
            lifeAlpha *
            slowTwinkle *
            star.brightness;

        const dx = star.x - mouseX;
        const dy = star.y - mouseY;

        const distance =
            Math.sqrt(dx * dx + dy * dy);

        let influence = 0;

        if (distance < POINTER_RADIUS) {

            influence =
                1 -
                distance / POINTER_RADIUS;

            influence =
                influence * influence;
        }

        alpha = Math.min(
            alpha + influence * 0.8,
            1
        );

        const size =
            star.size +
            influence * 1.2;

        const glow =
            influence * 12;

        drawStar(
            star.x,
            star.y,
            size,
            alpha,
            star.rotation,
            glow
        );
    }

    requestAnimationFrame(animate);
}

resize();
requestAnimationFrame(animate);
</script>


<script>
const textElements = document.querySelectorAll(
    ".song-title, .artist-name"
);

textElements.forEach(element => {

    const text = element.textContent;

    element.textContent = "";

    [...text].forEach(char => {

        const span = document.createElement("span");

        span.textContent =
            char === " " ? "\u00A0" : char;

        element.appendChild(span);
    });
});

function updateTextGlow(mouseX, mouseY) {

    textElements.forEach(element => {

        const letters =
            element.querySelectorAll("span");

        letters.forEach(letter => {

            const rect =
                letter.getBoundingClientRect();

            const centerX =
                rect.left + rect.width / 2;

            const centerY =
                rect.top + rect.height / 2;

            const dx =
                mouseX - centerX;

            const dy =
                mouseY - centerY;

            const distance =
                Math.sqrt(dx * dx + dy * dy);

            const radius = 80;

            let influence =
                1 - distance / radius;

            influence =
                Math.max(0, influence);

            influence =
                influence * influence;

            const opacity =
                0.7 +
                influence * 0.3;

            const scale =
                1 +
                influence * 0.08;

            const blur =
                influence * 12;

            const glowAlpha =
                influence * 0.9;

            letter.style.opacity = opacity;

            letter.style.transform =
                `scale(${scale})`;

            letter.style.textShadow =
                `0 0 ${blur}px rgba(255,255,255,${glowAlpha})`;
        });
    });
}

window.addEventListener("pointermove", e => {
    updateTextGlow(e.clientX, e.clientY);
});

window.addEventListener("pointerleave", () => {

    textElements.forEach(element => {

        element
            .querySelectorAll("span")
            .forEach(letter => {

                letter.style.opacity = "0.7";
                letter.style.transform = "scale(1)";
                letter.style.textShadow =
                    "0 0 0 rgba(255,255,255,0)";
            });
    });
});
</script>


<script>
const audio = document.getElementById("audio");
const playButton = document.getElementById("play");
const muteButton = document.getElementById("mute");
const progress = document.querySelector(".progress");


/* PLAY / PAUSE */

playButton.addEventListener("click", () => {

    if (audio.paused) {
        audio.play();
        playButton.textContent = "Pause";
    } else {
        audio.pause();
        playButton.textContent = "Play";
    }

});


/* MUTE */

muteButton.addEventListener("click", () => {

    audio.muted = !audio.muted;

    muteButton.textContent =
        audio.muted ? "Unmute" : "Mute";

});


/* UPDATE PROGRESS */

audio.addEventListener("timeupdate", () => {

    if (!audio.duration) return;

    progress.value =
        (audio.currentTime / audio.duration) * 100;

});


/* SEEK */

progress.addEventListener("input", () => {

    if (!audio.duration) return;

    audio.currentTime =
        (progress.value / 100) * audio.duration;

});


/* SONG ENDED */

audio.addEventListener("ended", () => {

    playButton.textContent = "Play";
    progress.value = 100;

});


/* RESET WHEN LOADED */

audio.addEventListener("loadedmetadata", () => {
    progress.value = 0;
});
</script>
